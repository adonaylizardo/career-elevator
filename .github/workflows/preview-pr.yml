name: Preview PR

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write

concurrency:
  group: pages-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build preview (root base path)
        run: npm run build
        env:
          VITE_BASE: /

      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy preview to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  comment:
    needs: deploy
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ needs.deploy.outputs.page_url }}
        with:
          script: |
            const previewUrl = process.env.PREVIEW_URL || '(see Deployments on this PR)';
            const prNumber = context.payload.pull_request.number;
            const branch = context.payload.pull_request.head.ref;
            const stackblitz = `https://stackblitz.com/github/adonaylizardo/career-elevator/tree/${branch}`;
            const marker = '<!-- career-elevator-preview-comment -->';
            const body = `${marker}
            ## Preview this branch

            | Option | Link |
            | --- | --- |
            | **GitHub Pages preview** | ${previewUrl} — built with \`VITE_BASE=/\` (iPad-friendly, no localhost). Also listed under **Deployments** on this PR. |
            | **StackBlitz** | [Open in StackBlitz](${stackblitz}) — if assets 404, set env \`VITE_BASE=/\`, then \`npm install && npm run dev\`. |

            **Live production (unchanged):** https://adonaylizardo.github.io/career-elevator/
            `;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }
