name: Preview PR

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pages-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build preview (root base path)
        run: npm run build
        env:
          VITE_BASE: /

      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: preview-dist-pr-${{ github.event.pull_request.number }}
          path: dist
          retention-days: 14

      - name: Deploy to Surge (optional)
        id: surge
        continue-on-error: true
        env:
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
        run: |
          if [ -z "$SURGE_TOKEN" ]; then
            echo "Surge token not configured."
            exit 0
          fi
          DOMAIN="career-elevator-pr-${{ github.event.pull_request.number }}.surge.sh"
          npx surge ./dist "$DOMAIN" --token "$SURGE_TOKEN"
          echo "url=https://${DOMAIN}" >> "$GITHUB_OUTPUT"

      - name: Comment preview links on PR
        uses: actions/github-script@v7
        env:
          SURGE_URL: ${{ steps.surge.outputs.url }}
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const branch = context.payload.pull_request.head.ref;
            const stackblitz = `https://stackblitz.com/github/adonaylizardo/career-elevator/tree/${branch}`;
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const surgeUrl = process.env.SURGE_URL;
            const marker = '<!-- career-elevator-preview-comment -->';

            let surgeRow;
            if (surgeUrl) {
              surgeRow = `| **Public preview (Surge)** | ${surgeUrl} — built with \`VITE_BASE=/\` |`;
            } else {
              surgeRow = `| **Public preview (Surge)** | Add \`SURGE_TOKEN\` repo secret to enable \`career-elevator-pr-${prNumber}.surge.sh\` |`;
            }

            const body = `${marker}
            ## Preview this branch (iPad-friendly)

            | Option | Link |
            | --- | --- |
            ${surgeRow}
            | **StackBlitz** | [Open in StackBlitz](${stackblitz}) — set env \`VITE_BASE=/\` if assets 404, then \`npm install && npm run dev\` |
            | **Artifact** | [Workflow run](${runUrl}) → Artifacts → \`preview-dist-pr-${prNumber}\` |

            Previews use \`VITE_BASE=/\` and do **not** touch production.

            **Live production (unchanged):** https://adonaylizardo.github.io/career-elevator/
            `;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }
